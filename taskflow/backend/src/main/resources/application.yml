server:
  port: 8080

spring:
  application:
    name: taskflow-backend
  data:
    mongodb:
      uri: mongodb://localhost:27017/taskflow_db
      database: taskflow_db

application:
  security:
    jwt:
      secret-key: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      expiration: 86400000  # 24 hours in ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.taskflow: DEBUG
    org.springframework.security: INFO
